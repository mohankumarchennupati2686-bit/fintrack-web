<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Personal Finance Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #2c3e50; }
        .hidden { display: none; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .dashboard-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1; padding: 20px; background: #ecf0f1; border-radius: 8px; text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 1.2em; }
        .card p { margin: 0; font-size: 1.5em; font-weight: bold; color: #27ae60; }
        .expense-text { color: #e74c3c !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .logout-btn { background-color: #e74c3c; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>FinTrack Analytics</h1>

    <!-- AUTHENTICATION SECTION -->
    <div id="authSection">
        <h2>Login or Register</h2>
        <input type="text" id="name" placeholder="Name (For Registration only)">
        <input type="email" id="email" placeholder="Email (e.g., alex@example.com)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="register()" style="background-color: #2ecc71;">Register</button>
        <p id="authMessage" style="color: red;"></p>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection" class="hidden">
        <h2 id="welcomeMessage">Welcome!</h2>
        
        <div class="dashboard-cards">
            <div class="card">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses" class="expense-text">₹0.00</p>
            </div>
            <div class="card">
                <h3>Remaining Balance</h3>
                <p id="balance">₹0.00</p>
            </div>
        </div>

        <h3>Add Transaction</h3>
        <input type="text" id="txTitle" placeholder="Title (e.g., Pizza with friends)">
        <input type="number" id="txAmount" placeholder="Amount (e.g., 450.50)">
        <select id="txType">
            <option value="EXPENSE">Expense</option>
            <option value="INCOME">Income</option>
        </select>
        <input type="text" id="txCategory" placeholder="Category (e.g., Food, Salary)">
        <button onclick="addTransaction()">Add Transaction</button>

        <h3>Transaction History</h3>
        <table id="txTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Type</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="txBody"></tbody>
        </table>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api';
    let currentUser = null;

    // Check if user is already logged in
    window.onload = () => {
        const storedUser = localStorage.getItem('fintrack_user');
        if (storedUser) {
            currentUser = JSON.parse(storedUser);
            showDashboard();
        }
    };

    async function register() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            if (res.ok) {
                document.getElementById('authMessage').innerText = "Registration successful! Please login.";
                document.getElementById('authMessage').style.color = "green";
            } else {
                document.getElementById('authMessage').innerText = "Registration failed.";
            }
        } catch (e) {
            document.getElementById('authMessage').innerText = "API unreachable. Is the Gateway running?";
        }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                currentUser = await res.json();
                localStorage.setItem('fintrack_user', JSON.stringify(currentUser));
                showDashboard();
            } else {
                document.getElementById('authMessage').innerText = "Invalid credentials.";
                document.getElementById('authMessage').style.color = "red";
            }
        } catch (e) {
            document.getElementById('authMessage').innerText = "API unreachable.";
        }
    }

    function showDashboard() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('welcomeMessage').innerText = `Welcome, ${currentUser.name}!`;
        fetchTransactions();
    }

    function logout() {
        localStorage.removeItem('fintrack_user');
        currentUser = null;
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('authMessage').innerText = "";
    }

    async function addTransaction() {
        const title = document.getElementById('txTitle').value;
        const amount = parseFloat(document.getElementById('txAmount').value);
        const type = document.getElementById('txType').value;
        const category = document.getElementById('txCategory').value;

        await fetch(`${API_URL}/transactions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUser.id, title, amount, type, category })
        });
        
        // Clear inputs
        document.getElementById('txTitle').value = '';
        document.getElementById('txAmount').value = '';
        document.getElementById('txCategory').value = '';
        
        fetchTransactions();
    }

    async function fetchTransactions() {
        const res = await fetch(`${API_URL}/transactions/user/${currentUser.id}`);
        const transactions = await res.json();
        
        const tbody = document.getElementById('txBody');
        tbody.innerHTML = '';
        
        let income = 0;
        let expense = 0;

        transactions.forEach(tx => {
            if (tx.type === 'INCOME') income += tx.amount;
            if (tx.type === 'EXPENSE') expense += tx.amount;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${tx.date}</td>
                <td>${tx.title}</td>
                <td>${tx.category}</td>
                <td style="color: ${tx.type === 'EXPENSE' ? 'red' : 'green'}">${tx.type}</td>
                <td>₹${tx.amount.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalIncome').innerText = `₹${income.toFixed(2)}`;
        document.getElementById('totalExpenses').innerText = `₹${expense.toFixed(2)}`;
        document.getElementById('balance').innerText = `₹${(income - expense).toFixed(2)}`;
    }
</script>
</body>
</html>
